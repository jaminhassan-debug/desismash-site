<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DesiSmash Post Kit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  body{padding-bottom:40px}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:18px}
  .wrap h1{font-size:3rem}
  .wrap h1 span{color:var(--orange)}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form label,.days legend{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .form .full{grid-column:1/-1}
  .days{display:flex;gap:8px;flex-wrap:wrap;border:0;padding:0;margin:0}
  .days legend{width:100%;margin-bottom:6px}
  .days label{flex-direction:row;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-transform:none;letter-spacing:0;font-size:.9rem;cursor:pointer}
  .days label:has(input:checked){border-color:var(--orange);background:#2b1a0d}
  .days input{width:auto;accent-color:var(--orange)}
  .post{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .post h2{font-size:1.5rem;color:var(--orange)}
  .post pre{margin:0;white-space:pre-wrap;word-wrap:break-word;font:inherit;font-size:.92rem;color:var(--fg)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row .fine{margin:0}
  @media(max-width:520px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <p class="fine"><a href="index.html">← Back to the site</a></p>
  <h1>Post <span>Kit</span></h1>
  <p class="fine">Pick this week's burger and your open days. Copy a ready caption for each app and paste it with your video or photo. Nothing here is sent anywhere.</p>

  <div class="form">
    <label class="full">Your website link<input id="p-url" placeholder="https://desismash.pages.dev"></label>
    <label class="full">Headline burger<select id="p-burger"></select></label>
    <fieldset class="days full" id="p-days"><legend>Open this weekend</legend></fieldset>
    <label>Open from<input id="p-from" value="5pm"></label>
    <label>Last orders<input id="p-to" value="10pm"></label>
    <label class="full">Extra line (optional)<input id="p-extra" placeholder="First 20 orders get a free dip pot"></label>
  </div>

  <div id="out" style="display:flex;flex-direction:column;gap:14px"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="config.js"></script>
<script>
(function () {
  const C = window.DESI, $ = (i) => document.getElementById(i);
  const DAYS = [['Fri', 5], ['Sat', 6], ['Sun', 0]];
  const FULL = { Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };
  const store = { get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* unavailable */ } } };

  $('p-url').value = store.get('ds-url', location.origin.startsWith('http') ? location.origin + location.pathname.replace(/post-kit\.html$/, '') : '');
  $('p-burger').innerHTML = C.burgers.map((b) => '<option value="' + b.id + '"' + (b.id === C.special ? ' selected' : '') + '>' + b.name + '</option>').join('');
  $('p-days').insertAdjacentHTML('beforeend', DAYS.map(([d]) => '<label><input type="checkbox" value="' + d + '" checked>' + FULL[d] + '</label>').join(''));

  const copy = async (t) => { try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (x) { /* ignore */ } a.remove(); } const el = $('toast'); el.textContent = 'Copied'; el.hidden = false; setTimeout(() => { el.hidden = true; }, 1500); };

  function render() {
    const b = C.burgers.find((x) => x.id === $('p-burger').value);
    const days = [...document.querySelectorAll('#p-days input:checked')].map((i) => i.value);
    const dayTxt = days.length === 3 ? 'Fri, Sat & Sun' : days.map((d) => FULL[d]).join(' & ');
    const url = $('p-url').value.trim();
    store.set('ds-url', url);
    const extra = $('p-extra').value.trim();
    const t = C.tiers[b.tier];
    const price = '£' + t.burger.toFixed(2) + ' (meal deal £' + t.meal.toFixed(2) + ')';
    const hours = $('p-from').value + ' to ' + $('p-to').value;
    const tags = '#desismash #smashburger #leicester #leicesterfood #leicesterburgers #desifood #chefmade #smashburgers #leicesterfoodie #fridaynight';
    const body = b.name + ': ' + b.desc + '\nOriginal or Desi patty, beef or chicken. From ' + price + '.';
    const open = 'Open ' + dayTxt + ', ' + hours + '.';
    const order = url ? 'Pre-order: ' + url : 'Pre-order on WhatsApp (link in bio).';
    const posts = [
      ['Instagram / Facebook post', ['This weekend\'s special: ' + b.name.toUpperCase(), '', body, '', extra, open, order, '', tags].filter((x, i, a) => x !== '' || a[i - 1] !== '').join('\n')],
      ['TikTok caption', [b.name + ' smashed fresh. 25 years of spice in one patty. ' + open, order.replace('Pre-order: ', 'Order: '), '#desismash #smashburger #leicester #leicesterfood #chefhass #foodtok'].join('\n')],
      ['WhatsApp status / broadcast', ['*DesiSmash by Chef Hass*', '*' + b.name + '* this weekend', 'From ' + price, open, extra, order].filter(Boolean).join('\n')],
      ['Story text (short)', [b.name.toUpperCase(), open.replace('Open ', ''), 'Order via link sticker'].join('\n')],
      ['Sold-out / last orders', ['Last orders in the next hour. ' + b.name + ' is going fast.', order, '#desismash #leicester'].join('\n')],
      ['Reel hook ideas', ['1. "Anyone can smash a burger. 25 years of spice changes everything."', '2. Whole spices toasting, then the Desi patty hitting the griddle.', '3. Close-up of the lace edge, then the cheese melt.', '4. Text on screen: "' + b.name + ' · ' + dayTxt + '"'].join('\n')]
    ];
    $('out').innerHTML = '';
    posts.forEach(([title, text]) => {
      const d = document.createElement('div'); d.className = 'post';
      d.innerHTML = '<h2></h2><pre></pre><div class="row"><button class="btn primary" type="button">Copy</button></div>';
      d.querySelector('h2').textContent = title; d.querySelector('pre').textContent = text;
      d.querySelector('button').onclick = () => copy(text);
      $('out').appendChild(d);
    });
  }
  document.querySelectorAll('input,select').forEach((e) => e.addEventListener('input', render));
  render();
})();
</script>
</body>
</html>
